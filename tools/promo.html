<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Promo renderer</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Promo video frames. tools/promo.mjs calls setup(), prepare() and frame().

const W = 1920, H = 1080, SIDE = 96;
const MONO = '"JetBrainsMono Nerd Font", "JetBrains Mono", monospace';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let S = null, LOGO = [], images = new Map(), wall = null;

function rgba(hex, a) { const n = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)); return `rgba(${n[0]},${n[1]},${n[2]},${a})`; }
function ease(t) { t = Math.max(0, Math.min(1, t)); return 1 - Math.pow(1 - t, 3); }
function load(src) { return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; }); }

window.setup = async (config) => {
  S = config;
  LOGO = config.logo.map(p => ({ path: new Path2D(p.d), rule: p.evenodd ? 'evenodd' : 'nonzero' }));
  wall = await load(config.wall);
  await document.fonts.load(`40px ${MONO}`);
  await document.fonts.load(`bold 40px ${MONO}`);
};

// Keeps the screenshots of the current and the next clip in memory only.
window.prepare = async (j) => {
  for (const k of [...images.keys()]) if (k < j - 1) images.delete(k);
  for (const k of [j, j + 1]) if (k < S.clips.length && !images.has(k)) images.set(k, await load(S.clips[k].shot));
};

function drawLogo(x, y, width, fill, alpha = 1) {
  const s = width / 1215;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = fill; LOGO.forEach(p => ctx.fill(p.path, p.rule));
  ctx.restore();
}

function glowLogo(x, y, width, t, alpha) {
  const g = ctx.createLinearGradient(0, 0, 1215, 0);
  g.addColorStop(0, t.ansi[6]); g.addColorStop(1, t.ansi[5]);
  ctx.save(); ctx.shadowColor = rgba(t.colors.accent, .8 * alpha); ctx.shadowBlur = 60;
  drawLogo(x, y, width, g, alpha);
  ctx.shadowBlur = 20; drawLogo(x, y, width, g, alpha);
  ctx.restore();
}

function text(str, x, y, size, color, opts = {}) {
  ctx.save();
  ctx.font = `${opts.bold ? 'bold ' : ''}${size}px ${MONO}`;
  ctx.fillStyle = color; ctx.textAlign = opts.align || 'left'; ctx.textBaseline = opts.baseline || 'alphabetic';
  if (opts.glow) { ctx.shadowColor = opts.glow; ctx.shadowBlur = opts.blur || 24; }
  if (opts.alpha !== undefined) ctx.globalAlpha = opts.alpha;
  if (opts.spacing) ctx.letterSpacing = opts.spacing;
  ctx.fillText(str, x, y);
  ctx.restore();
}

function fade(f, n, end) {
  const a = f < 6 ? 1 - f / 6 : end && f > n - 14 ? (f - (n - 14)) / 14 : 0;
  if (a > 0) { ctx.fillStyle = `rgba(0,0,0,${a})`; ctx.fillRect(0, 0, W, H); }
}

// The corner chip that reminds viewers how many themes there are.
function chip(t, alpha = 1) {
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.font = `bold 24px ${MONO}`;
  const label = '100 themes × 5 variants', w = ctx.measureText(label).width + 40;
  ctx.fillStyle = rgba(t.colors.background, .9); ctx.beginPath(); ctx.roundRect(W - SIDE - 30 - w, 26, w, 52, 26); ctx.fill();
  ctx.strokeStyle = t.colors.accent; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = t.colors.foreground; ctx.textBaseline = 'middle'; ctx.fillText(label, W - SIDE - 10 - w, 53);
  ctx.restore();
}

function intro(f, n) {
  const t = S.intro;
  ctx.fillStyle = t.colors.darker_background; ctx.fillRect(0, 0, W, H);
  const glow = ctx.createRadialGradient(W / 2, H * .42, 0, W / 2, H * .42, W * .5);
  glow.addColorStop(0, rgba(t.colors.accent, .18 * ease(f / 20))); glow.addColorStop(1, rgba(t.colors.accent, 0));
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  const flicker = f < 4 ? 0 : f < 6 ? .8 : f < 8 ? .15 : f < 10 ? 1 : f < 11 ? .4 : 1;
  const width = 860 + 40 * ease(f / n);
  glowLogo((W - width) / 2, H * .3 - width * 285 / 1215 / 2, width, t, flicker);
  // The count builds up: 100 themes, x 5 variants, = 500 themes
  const steps = [['100 THEMES', 22], ['× 5 VARIANTS', 44], ['= 500 THEMES', 66]];
  steps.forEach(([label, start], i) => {
    const a = ease((f - start) / 10);
    const big = i === 2;
    text(label, W / 2, H * (.56 + i * .1), big ? 64 : 44, big ? t.ansi[13] : t.colors.foreground,
      { align: 'center', bold: true, alpha: a, spacing: big ? '8px' : '6px', glow: big ? rgba(t.colors.accent, .8) : undefined, blur: 30 });
  });
  fade(f, n, false);
}

function section(seg, f, n) {
  const t = seg.theme;
  ctx.fillStyle = t.colors.background; ctx.fillRect(0, 0, W, H);
  // Stripes of the 16 colors slide in from the left
  for (let k = 0; k < 16; k++) {
    const d = ease((f - k * .6) / 8);
    ctx.fillStyle = t.ansi[k]; ctx.fillRect(0, (H / 16) * k, W * .12 * d, H / 16 + 1);
  }
  const a = ease(f / 6);
  text(seg.label.toUpperCase(), W * .2, H * .5, 150, t.colors.foreground, { bold: true, alpha: a, baseline: 'middle', glow: rgba(t.colors.accent, .6), blur: 40 });
  text(`${seg.part} of 5  ·  ${S.perVariant} of 100 shown`, W * .2 + 6, H * .5 + 120, 36, t.colors.dark_foreground, { alpha: ease((f - 4) / 8), spacing: '3px' });
  chip(t, a);
}

function clip(j, f, n) {
  const c = S.clips[j], t = c, img = images.get(j);
  ctx.fillStyle = t.colors.darker_background; ctx.fillRect(0, 0, W, H);
  const z = 1 + .045 * (1 - ease(f / 9));
  const sw = W - SIDE * 2, sh = H;
  ctx.save(); ctx.beginPath(); ctx.rect(SIDE, 0, sw, sh); ctx.clip();
  const iw = sw * z, ih = iw * img.height / img.width;
  ctx.drawImage(img, SIDE + (sw - iw) / 2, (sh - ih) / 2, iw, ih);
  ctx.restore();
  const sq = 44, gap = 14, y0 = (H - (8 * sq + 7 * gap)) / 2;
  for (let k = 0; k < 8; k++) {
    const d = ease((f - k) / 5);
    ctx.fillStyle = t.ansi[k]; ctx.fillRect(SIDE / 2 - sq / 2 - (1 - d) * 60, y0 + k * (sq + gap), sq, sq);
    ctx.fillStyle = t.ansi[k + 8]; ctx.fillRect(W - SIDE / 2 - sq / 2 + (1 - d) * 60, y0 + k * (sq + gap), sq, sq);
  }
  // Name label: variant on the first line, theme name on the second
  const a = ease(f / 6), dx = (1 - a) * -40;
  ctx.save(); ctx.globalAlpha = a;
  const top = `${c.label.toUpperCase()}  ·  ${String(c.n).padStart(3, '0')} / ${S.clips.length}`;
  ctx.font = `bold 64px ${MONO}`;
  const nameW = ctx.measureText(c.name).width;
  ctx.font = `26px ${MONO}`; ctx.letterSpacing = '2px';
  const topW = ctx.measureText(top).width;
  ctx.letterSpacing = '0px';
  // The box fits the wider of the 2 lines.
  const bx = SIDE + 40 + dx, bh = 150, by = H - 60 - bh, bw = Math.max(nameW, topW) + 72;
  ctx.fillStyle = rgba(t.colors.background, .93); ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 16); ctx.fill();
  const border = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  border.addColorStop(0, t.ansi[6]); border.addColorStop(1, t.ansi[5]);
  ctx.lineWidth = 3; ctx.strokeStyle = border; ctx.stroke();
  ctx.restore();
  text(top, bx + 36, by + 50, 26, t.colors.dark_foreground, { alpha: a, spacing: '2px' });
  text(c.name, bx + 36, by + 118, 64, t.colors.bright_foreground, { bold: true, alpha: a, glow: rgba(t.colors.accent, .7), blur: 22 });
  chip(t);
  const p = (j + f / n) / S.clips.length;
  const g = ctx.createLinearGradient(SIDE, 0, W - SIDE, 0);
  g.addColorStop(0, t.ansi[6]); g.addColorStop(1, t.ansi[5]);
  ctx.fillStyle = rgba(t.colors.darker_background, .8); ctx.fillRect(SIDE, H - 8, sw, 8);
  ctx.fillStyle = g; ctx.fillRect(SIDE, H - 8, sw * p, 8);
}

function outro(f, n) {
  const t = S.intro;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  // The wall of all 500 screenshots slowly zooms out
  const z = 1.25 - .25 * ease(f / n);
  const iw = W * z, ih = iw * wall.height / wall.width;
  ctx.save(); ctx.globalAlpha = ease(f / 8); ctx.drawImage(wall, (W - iw) / 2, (H - ih) / 2, iw, ih); ctx.restore();
  ctx.fillStyle = rgba(t.colors.darker_background, .78 * ease((f - 34) / 12)); ctx.fillRect(0, 0, W, H);
  const lines = [[`YOU SAW ${S.clips.length}.`, 10, 48, t.colors.foreground], [`${S.total - S.clips.length} MORE ARE WAITING.`, 22, 48, t.colors.foreground]];
  lines.forEach(([s, start, size, color], i) => {
    const a = ease((f - start) / 8) * (1 - ease((f - 32) / 8));
    text(s, W / 2, H * (.45 + i * .1), size, color, { align: 'center', bold: true, alpha: a, spacing: '6px', glow: 'rgba(0,0,0,.9)', blur: 30 });
  });
  const b = ease((f - 40) / 10);
  glowLogo((W - 640) / 2, H * .24, 640, t, b);
  text(`${S.total} THEMES`, W / 2, H * .58, 96, t.ansi[13], { align: 'center', bold: true, alpha: b, spacing: '10px', glow: rgba(t.colors.accent, .9), blur: 40 });
  text('100 themes × dark, day, high contrast, day high contrast, OLED', W / 2, H * .66, 28, t.colors.foreground, { align: 'center', alpha: ease((f - 48) / 10) });
  text(S.url, W / 2, H * .74, 36, t.ansi[14], { align: 'center', bold: true, alpha: ease((f - 54) / 10), glow: rgba(t.ansi[6], .6) });
  fade(f, n, true);
}

window.frame = (seg, f, n, quality = .93) => {
  if (seg.kind === 'intro') intro(f, n);
  else if (seg.kind === 'section') section(seg, f, n);
  else if (seg.kind === 'outro') outro(f, n);
  else clip(seg.index, f, n);
  return cv.toDataURL('image/jpeg', quality);
};
</script>
</body>
</html>
