<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Theme renderer</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Background renderer. tools/render.mjs loads this page in headless Chromium
// and calls window.renderImage(). All drawing uses a 3840x2160 design space.
// S scales the design space to the output size. Full-size layers use the
// output resolution, and blur radii scale with S, so every size looks the same.

const W = 3840, H = 2160;
const MONO = '"JetBrainsMono Nerd Font", "JetBrains Mono", monospace';
let LOGO = [];
let S = 1;

window.setLogo = paths => { LOGO = paths.map(p => ({ path: new Path2D(p.d), rule: p.evenodd ? 'evenodd' : 'nonzero' })); };

// ---------- helpers ----------

function rng(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function rgb(hex) { return [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)); }
function rgba(hex, a) { const [r, g, b] = rgb(hex); return `rgba(${r},${g},${b},${a})`; }
function mix(a, b, t) {
  const pa = rgb(a), pb = rgb(b);
  return '#' + pa.map((v, i) => Math.round(v * (1 - t) + pb[i] * t).toString(16).padStart(2, '0')).join('');
}
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function smooth(t) { return t * t * (3 - 2 * t); }

// A layer without a size covers the design space at the output resolution.
// Draw it back with drawImage(cv, 0, 0, W, H). A layer with a size is a
// small helper bitmap at that exact pixel size.
function layer(w, h) {
  const cv = document.createElement('canvas');
  const full = w === undefined;
  cv.width = full ? Math.round(W * S) : w; cv.height = full ? Math.round(H * S) : h;
  const cx = cv.getContext('2d');
  if (full) cx.setTransform(S, 0, 0, S, 0, 0);
  return [cv, cx];
}

// Canvas blur ignores the transform, so the radius scales with S.
const blur = r => `blur(${(r * S).toFixed(1)}px)`;

// Seeded 2D gradient noise.
function makeNoise(seed) {
  const r = rng(seed), perm = new Uint8Array(512), grad = [];
  const p = [...Array(256).keys()];
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  for (let i = 0; i < 256; i++) { const a = r() * Math.PI * 2; grad.push([Math.cos(a), Math.sin(a)]); }
  const dot = (ix, iy, x, y) => { const g = grad[perm[ix + perm[iy & 255]]]; return g[0] * (x - ix) + g[1] * (y - iy); };
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  function n(x, y) {
    const x0 = Math.floor(x), y0 = Math.floor(y), sx = fade(x - x0), sy = fade(y - y0);
    const X = x0 & 255, Y = y0 & 255, fx = x - x0, fy = y - y0;
    const d = (dx, dy) => { const g = grad[perm[((X + dx) & 255) + perm[(Y + dy) & 255]]]; return g[0] * (fx - dx) + g[1] * (fy - dy); };
    return lerp(lerp(d(0, 0), d(1, 0), sx), lerp(d(0, 1), d(1, 1), sx), sy);
  }
  n.fbm = (x, y, oct = 5) => { let s = 0, a = .5, f = 1; for (let i = 0; i < oct; i++) { s += a * n(x * f, y * f); a *= .5; f *= 2; } return s; };
  return n;
}

// Draws a layer three times: two blurred passes for the glow, then the sharp pass.
function bloom(ctx, draw, radii = [90, 28], strength = [.85, .9]) {
  const [cv, lx] = layer();
  draw(lx);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  radii.forEach((r, i) => { ctx.filter = blur(r); ctx.globalAlpha = strength[i]; ctx.drawImage(cv, 0, 0, W, H); });
  ctx.filter = 'none'; ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(cv, 0, 0, W, H);
  ctx.restore();
}

function vignette(ctx, P, amount = .55) {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, W * .62);
  g.addColorStop(0, rgba(P.darker, 0));
  g.addColorStop(1, rgba(P.darker, amount));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// Fine grain hides gradient banding after JPEG compression.
function grain(ctx, seed, alpha = .05) {
  const [cv, gx] = layer(256, 256), r = rng(seed), img = gx.createImageData(256, 256);
  for (let i = 0; i < img.data.length; i += 4) { const v = r() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  gx.putImageData(img, 0, 0);
  ctx.save();
  ctx.globalAlpha = alpha; ctx.globalCompositeOperation = 'overlay';
  const pattern = ctx.createPattern(cv, 'repeat');
  pattern.setTransform(new DOMMatrix().scale(1 / S));
  ctx.fillStyle = pattern; ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

function stars(ctx, r, count, yMax, colors, maxSize = 3.2) {
  for (let i = 0; i < count; i++) {
    const x = r() * W, y = Math.pow(r(), 1.4) * yMax, s = Math.pow(r(), 3) * maxSize + .6;
    ctx.fillStyle = rgba(colors[Math.floor(r() * colors.length)], .25 + r() * .75);
    ctx.beginPath(); ctx.arc(x, y, s, 0, Math.PI * 2); ctx.fill();
  }
}

function skyGradient(ctx, stops) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  stops.forEach(([o, c]) => g.addColorStop(o, c));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function ridge(r, noise, base, amp, freq, seedShift) {
  const pts = [];
  for (let x = -20; x <= W + 20; x += 12) pts.push([x, base - Math.abs(noise.fbm(x * freq + seedShift, seedShift, 4)) * amp - noise.fbm(x * freq * 3, seedShift + 9, 2) * amp * .25]);
  return pts;
}

function fillRidge(ctx, pts, color) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], H);
  pts.forEach(([x, y]) => ctx.lineTo(x, y));
  ctx.lineTo(pts[pts.length - 1][0], H); ctx.closePath();
  ctx.fillStyle = color; ctx.fill();
}

function strokeRidge(ctx, pts, color, width) {
  ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke();
}

// ---------- the wordmark background ----------

function drawLogo(ctx, x, y, scale, fill) {
  ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
  ctx.fillStyle = fill;
  LOGO.forEach(p => ctx.fill(p.path, p.rule));
  ctx.restore();
}

function wordmark(ctx, P, r) {
  ctx.fillStyle = P.bg; ctx.fillRect(0, 0, W, H);

  const glow = ctx.createRadialGradient(W / 2, H * .47, 0, W / 2, H * .47, W * .5);
  glow.addColorStop(0, rgba(P.accent, .16));
  glow.addColorStop(.45, rgba(P.c[4], .06));
  glow.addColorStop(1, rgba(P.bg, 0));
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

  // Dot grid
  for (let y = 60; y < H; y += 72) for (let x = 60; x < W; x += 72) {
    const d = Math.hypot(x - W / 2, (y - H * .47) * 1.6) / W;
    ctx.fillStyle = rgba(P.c[8], clamp(.5 - d * .55, .08, .5));
    ctx.fillRect(x - 2, y - 2, 4, 4);
  }

  const scale = 1560 / 1215, lw = 1215 * scale, lh = 285 * scale;
  const lx = (W - lw) / 2, ly = H * .47 - lh / 2;
  // The gradient is in logo units because drawLogo() scales the context.
  const grad = ctx.createLinearGradient(0, 0, 1215, 0);
  grad.addColorStop(0, P.c[6]); grad.addColorStop(.5, mix(P.c[6], P.c[5], .5)); grad.addColorStop(1, P.c[5]);

  // Floor reflection, faded with a mask so no edge shows
  const [rcv, rx] = layer();
  rx.save(); rx.translate(0, (ly + lh) * 2 + 40); rx.scale(1, -1); drawLogo(rx, lx, ly, scale, grad); rx.restore();
  const mask = rx.createLinearGradient(0, ly + lh + 40, 0, ly + lh + 40 + lh * .8);
  mask.addColorStop(0, 'rgba(0,0,0,.2)'); mask.addColorStop(1, 'rgba(0,0,0,0)');
  rx.globalCompositeOperation = 'destination-in'; rx.fillStyle = mask; rx.fillRect(0, 0, W, H);
  ctx.save(); ctx.filter = blur(4); ctx.drawImage(rcv, 0, 0, W, H); ctx.restore();

  bloom(ctx, lx2 => drawLogo(lx2, lx, ly, scale, grad), [120, 36], [.7, .55]);

  // ANSI strip: the 6 normal colors and the 6 bright colors
  const sw = 52, gap = 14, cols = [1, 2, 3, 4, 5, 6];
  const total = cols.length * sw + (cols.length - 1) * gap, sx = (W - total) / 2, sy = ly + lh + 300;
  cols.forEach((k, i) => {
    ctx.fillStyle = P.c[k]; ctx.fillRect(sx + i * (sw + gap), sy, sw, 10);
    ctx.fillStyle = P.c[k + 8]; ctx.fillRect(sx + i * (sw + gap), sy + 18, sw, 10);
  });

  vignette(ctx, P, .5);
  grain(ctx, P.index * 31, .045);
}

// ---------- native motifs ----------

const MOTIFS = {};

MOTIFS['sunset-grid'] = (ctx, P, r, noise) => {
  const hz = H * .6;
  skyGradient(ctx, [[0, P.darker], [.35, P.bg], [.58, mix(P.bg, P.c[5], .38)], [.6, mix(P.bg, P.c[1], .5)], [.6001, P.darker], [1, P.darker]]);
  stars(ctx, r, 900, hz * .8, [P.fg, P.c[14], P.c[13]], 2.6);

  // Sun with stripe cuts
  const [scv, sx] = layer();
  const sr = 560, scx = W / 2, scy = hz - 150;
  const sg = sx.createLinearGradient(0, scy - sr, 0, scy + sr);
  sg.addColorStop(0, P.c[11]); sg.addColorStop(.45, P.c[3]); sg.addColorStop(.75, P.c[1]); sg.addColorStop(1, P.c[5]);
  sx.fillStyle = sg; sx.beginPath(); sx.arc(scx, scy, sr, 0, Math.PI * 2); sx.fill();
  sx.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 9; i++) { const y = scy + 30 + i * i * 7 + i * 34, h = 6 + i * 4.2; sx.fillRect(0, y, W, h); }
  sx.globalCompositeOperation = 'source-over';
  sx.clearRect(0, hz, W, H);
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.filter = blur(140); ctx.globalAlpha = .55; ctx.drawImage(scv, 0, 0, W, H); ctx.restore();
  ctx.drawImage(scv, 0, 0, W, H);

  // Mountains
  const far = ridge(r, noise, hz, 360, .0011, 3);
  fillRidge(ctx, far, mix(P.darker, P.c[5], .12));
  bloom(ctx, lx => strokeRidge(lx, far, rgba(P.c[5], .9), 3), [30, 10], [.8, .6]);
  const near = ridge(r, noise, hz + 4, 190, .0021, 11);
  fillRidge(ctx, near, P.darker);
  bloom(ctx, lx => strokeRidge(lx, near, P.c[6], 3.5), [36, 10], [.9, .7]);
  ctx.fillStyle = P.darker; ctx.fillRect(0, hz, W, H - hz);

  // Grid floor
  bloom(ctx, lx => {
    lx.lineWidth = 3;
    for (let i = -40; i <= 40; i++) {
      const bx = W / 2 + i * 230;
      const g = lx.createLinearGradient(0, hz, 0, H);
      g.addColorStop(0, rgba(P.c[5], 0)); g.addColorStop(.35, rgba(P.c[5], .8)); g.addColorStop(1, rgba(P.c[5], 1));
      lx.strokeStyle = g; lx.beginPath(); lx.moveTo(W / 2 + i * 12, hz); lx.lineTo(W / 2 + (bx - W / 2) * 6, H + 1400); lx.stroke();
    }
    for (let k = 1; k < 40; k++) {
      const y = hz + Math.pow(k, 2.1) * 3.2;
      if (y > H) break;
      lx.strokeStyle = rgba(P.c[5], clamp((y - hz) / 300, .15, 1)); lx.lineWidth = 2 + (y - hz) / 400;
      lx.beginPath(); lx.moveTo(0, y); lx.lineTo(W, y); lx.stroke();
    }
    lx.fillStyle = P.c[14]; lx.fillRect(0, hz - 2, W, 4);
  }, [60, 16], [.9, .8]);

  vignette(ctx, P, .5);
  grain(ctx, P.index * 17, .05);
};

MOTIFS['code-rain'] = (ctx, P, r) => {
  skyGradient(ctx, [[0, P.darker], [.5, P.bg], [1, P.darker]]);
  const glyphs = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789ABCDEF<>/{}[]=+*';
  const size = 40, colW = 46;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const heads = [];
  for (let col = 0; col * colW < W + colW; col++) {
    const x = col * colW + colW / 2;
    const depth = r();
    const font = Math.round(size * (.7 + depth * .45));
    ctx.font = `${font}px ${MONO}`;
    const streams = 1 + Math.floor(r() * 2.2);
    for (let s = 0; s < streams; s++) {
      const len = 8 + Math.floor(r() * 34), headY = r() * (H + 600) - 200;
      for (let k = 0; k < len; k++) {
        const y = headY - k * font * 1.05;
        if (y < -font || y > H) continue;
        const t = k / len;
        const color = k === 0 ? P.c[15] : t < .25 ? P.c[10] : P.c[2];
        ctx.fillStyle = rgba(color, (1 - t) * (.3 + depth * .7));
        ctx.fillText(glyphs[Math.floor(r() * glyphs.length)], x, y);
      }
      if (headY > 0 && headY < H) heads.push([x, headY, font]);
    }
  }
  bloom(ctx, lx => {
    lx.textAlign = 'center'; lx.textBaseline = 'top';
    heads.forEach(([x, y, f]) => { lx.font = `${f}px ${MONO}`; lx.fillStyle = P.c[10]; lx.fillText(glyphs[Math.floor(r() * glyphs.length)], x, y); });
  }, [40, 12], [.9, .8]);
  ctx.fillStyle = rgba(P.darker, .22);
  for (let y = 0; y < H; y += 6) ctx.fillRect(0, y, W, 2);
  vignette(ctx, P, .7);
  grain(ctx, P.index * 13, .04);
};

function cloudField(ctx, P, noise, colors, opts = {}) {
  const cw = 480, ch = 270, [cv, cx] = layer(cw, ch), img = cx.createImageData(cw, ch);
  const cols = colors.map(rgb), sc = opts.scale || 2.4, band = opts.band ?? .55;
  for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) {
    const u = x / cw, v = y / ch;
    const warp = noise.fbm(u * 2 + 11, v * 2 + 3, 3) * 1.4;
    let d = noise.fbm(u * sc + warp, v * sc * .6 - warp, 6) * .5 + .5;
    const diag = Math.abs((v - .5) - (u - .5) * (opts.tilt ?? -.45));
    d *= clamp(1 - diag / band, 0, 1);
    d = clamp((d - .28) * 1.9, 0, 1);
    const hue = clamp(noise.fbm(u * 1.3 + 40, v * 1.3, 3) * .9 + .5, 0, .999) * (cols.length - 1);
    const i0 = Math.floor(hue), t = hue - i0, a = cols[i0], b = cols[Math.min(i0 + 1, cols.length - 1)];
    const k = (y * cw + x) * 4;
    img.data[k] = lerp(a[0], b[0], t); img.data[k + 1] = lerp(a[1], b[1], t); img.data[k + 2] = lerp(a[2], b[2], t);
    img.data[k + 3] = Math.min(255, Math.pow(d, 1.2) * 300 * (opts.alpha ?? .9));
  }
  cx.putImageData(img, 0, 0);
  ctx.save(); ctx.imageSmoothingQuality = 'high'; ctx.globalCompositeOperation = 'lighter';
  ctx.filter = blur(18); ctx.drawImage(cv, 0, 0, W, H);
  ctx.filter = blur(3); ctx.globalAlpha = .6; ctx.drawImage(cv, 0, 0, W, H);
  ctx.restore();
}

MOTIFS['nebula'] = (ctx, P, r, noise) => {
  ctx.fillStyle = P.darker; ctx.fillRect(0, 0, W, H);
  stars(ctx, r, 2600, H, [P.fg, P.c[14], P.c[12], P.c[11]], 2.4);
  cloudField(ctx, P, noise, [P.c[4], P.c[5], P.c[1], P.c[13], P.c[6]], { tilt: -.5 + r() * .3, band: .6 });
  cloudField(ctx, P, makeNoise(P.index * 3 + 1), [P.c[12], P.c[5]], { tilt: -.3, band: .35, alpha: .6, scale: 4 });
  // Bright stars with cross glare
  bloom(ctx, lx => {
    for (let i = 0; i < 26; i++) {
      const x = r() * W, y = r() * H, s = 2 + r() * 5, col = [P.c[15], P.c[14], P.c[11]][i % 3];
      lx.fillStyle = col; lx.beginPath(); lx.arc(x, y, s, 0, Math.PI * 2); lx.fill();
      lx.strokeStyle = rgba(col, .7); lx.lineWidth = 1.5;
      lx.beginPath(); lx.moveTo(x - s * 18, y); lx.lineTo(x + s * 18, y); lx.moveTo(x, y - s * 18); lx.lineTo(x, y + s * 18); lx.stroke();
    }
  }, [30, 8], [.9, .8]);
  vignette(ctx, P, .55);
  grain(ctx, P.index * 7, .045);
};

MOTIFS['aurora'] = (ctx, P, r, noise) => {
  const hz = H * .72;
  skyGradient(ctx, [[0, P.darker], [.6, P.bg], [.72, mix(P.bg, P.c[6], .18)], [1, P.darker]]);
  stars(ctx, r, 1400, hz, [P.fg, P.c[14]], 2.4);
  const [acv, ax] = layer();
  ax.globalCompositeOperation = 'lighter';
  const bands = [[P.c[2], P.c[6], .34, 0], [P.c[6], P.c[4], .26, 50], [P.c[10], P.c[5], .3, 90]];
  bands.forEach(([low, high, base, off], bi) => {
    for (let x = 0; x < W; x += 4) {
      const u = x / W;
      const y = H * (base + .14 * noise.fbm(u * 2.2 + off, bi * 3, 3) + .05 * Math.sin(u * 7 + bi));
      const inten = clamp(noise.fbm(u * 9 + off, bi * 7 + 1, 3) * 1.4 + .45, 0, 1) * (.4 + .6 * Math.sin(u * Math.PI));
      const len = 380 + 520 * clamp(noise(u * 5 + off, bi + 20) + .5, 0, 1);
      const g = ax.createLinearGradient(0, y, 0, y - len);
      g.addColorStop(0, rgba(low, 0)); g.addColorStop(.06, rgba(low, .55 * inten));
      g.addColorStop(.45, rgba(high, .28 * inten)); g.addColorStop(1, rgba(high, 0));
      ax.fillStyle = g; ax.fillRect(x, y - len, 4, len);
    }
  });
  ctx.save(); ctx.filter = blur(10); ctx.drawImage(acv, 0, 0, W, H); ctx.filter = blur(60); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .6; ctx.drawImage(acv, 0, 0, W, H); ctx.restore();

  // Water reflection
  ctx.save();
  ctx.beginPath(); ctx.rect(0, hz, W, H - hz); ctx.clip();
  ctx.fillStyle = P.darker; ctx.fillRect(0, hz, W, H - hz);
  ctx.translate(0, hz * 2); ctx.scale(1, -1); ctx.globalAlpha = .35; ctx.filter = blur(14);
  ctx.drawImage(acv, 0, 0, W, H);
  ctx.restore();

  const far = ridge(r, noise, hz, 260, .0012, 5);
  fillRidge(ctx, far, mix(P.darker, P.c[4], .1));
  const near = ridge(r, noise, hz + 2, 120, .003, 17);
  fillRidge(ctx, near, P.darker);
  ctx.fillStyle = P.darker; ctx.fillRect(0, hz, W, 8);
  // Reflection of the ridge edge
  ctx.fillStyle = rgba(P.c[6], .18); ctx.fillRect(0, hz + 8, W, 2);
  vignette(ctx, P, .5);
  grain(ctx, P.index * 5, .045);
};

MOTIFS['skyline'] = (ctx, P, r, noise) => {
  const street = H * .8;
  skyGradient(ctx, [[0, P.darker], [.45, P.bg], [.78, mix(P.bg, P.c[5], .3)], [1, P.darker]]);
  cloudField(ctx, P, noise, [P.c[5], P.c[4]], { alpha: .25, band: .35, tilt: 0 });
  const [ccv, cx] = layer();
  const layers = [[.5, mix(P.bg, P.c[4], .12), 180, .25], [.62, mix(P.darker, P.c[4], .08), 240, .55], [.72, P.darker, 300, 1]];
  const neon = [];
  layers.forEach(([top, color, wAvg, lit], li) => {
    let x = -50;
    while (x < W + 50) {
      const bw = wAvg * (.5 + r()), bh = H * (1 - top) * (.35 + r() * .75) * (li === 0 ? 1.2 : 1);
      const by = street - bh;
      cx.fillStyle = color; cx.fillRect(x, by, bw, bh + 10);
      if (r() < .3) { cx.fillRect(x + bw * .45, by - 80, 6, 80); cx.fillStyle = P.c[1]; cx.fillRect(x + bw * .45 - 3, by - 86, 12, 12); }
      // Windows
      const ww = 10 + li * 4, wh = 16 + li * 5;
      for (let wy = by + 30; wy < street - 20; wy += wh * 2.1) for (let wx = x + 14; wx < x + bw - 14; wx += ww * 2.4) {
        if (r() < .32 * lit) { cx.fillStyle = rgba([P.c[3], P.c[6], P.c[15], P.c[11]][Math.floor(r() * 4)], .35 + r() * .5); cx.fillRect(wx, wy, ww, wh); }
      }
      if (li > 0 && r() < .45) neon.push({ x: x + bw * (.15 + r() * .6), y: by + 60 + r() * bh * .3, h: 160 + r() * 380, color: [P.c[5], P.c[6], P.c[1], P.c[3], P.c[13]][Math.floor(r() * 5)], horiz: r() < .35 });
      x += bw + 6 + r() * 30;
    }
  });
  ctx.drawImage(ccv, 0, 0, W, H);
  bloom(ctx, lx => {
    neon.forEach(n => {
      lx.strokeStyle = n.color; lx.lineWidth = 7;
      if (n.horiz) { lx.strokeRect(n.x - n.h * .4, n.y, n.h * .8, 70); }
      else { lx.strokeRect(n.x, n.y, 60, n.h); for (let k = 1; k < 4; k++) lx.fillStyle = n.color, lx.fillRect(n.x + 18, n.y + k * n.h / 4 - 10, 24, 12); }
    });
  }, [60, 14], [.9, .8]);
  // Wet street reflection
  ctx.save();
  ctx.beginPath(); ctx.rect(0, street, W, H - street); ctx.clip();
  ctx.fillStyle = P.darker; ctx.fillRect(0, street, W, H - street);
  ctx.translate(0, street * 2); ctx.scale(1, -1); ctx.globalAlpha = .45; ctx.filter = blur(10);
  ctx.drawImage(ccv, 0, 0, W, H);
  ctx.restore();
  // Rain
  ctx.strokeStyle = rgba(P.c[14], .12); ctx.lineWidth = 1.5;
  for (let i = 0; i < 1600; i++) { const x = r() * W, y = r() * H, l = 30 + r() * 70; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - l * .18, y + l); ctx.stroke(); }
  vignette(ctx, P, .55);
  grain(ctx, P.index * 3, .05);
};

MOTIFS['equalizer'] = (ctx, P, r, noise) => {
  skyGradient(ctx, [[0, P.darker], [.5, P.bg], [1, P.darker]]);
  ctx.strokeStyle = rgba(P.c[8], .18); ctx.lineWidth = 2;
  for (let y = 120; y < H; y += 120) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  const base = H * .66, n = 64, bw = 34, gap = 16, total = n * (bw + gap) - gap, x0 = (W - total) / 2;
  const heights = [], p1 = .15 + r() * .35, p2 = .55 + r() * .35, w1 = 2 + r() * 2.5, w2 = 2.5 + r() * 3, a2 = .4 + r() * .5;
  for (let i = 0; i < n; i++) {
    const u = i / (n - 1);
    const env = Math.exp(-Math.pow((u - p1) * w1, 2)) * .9 + Math.exp(-Math.pow((u - p2) * w2, 2)) * a2 + .12;
    heights.push(clamp(env * (.55 + .45 * (noise(u * 9, 3) + .5)) + (r() - .5) * .12, .05, 1) * 900);
  }
  const drawBars = (lx, alpha) => {
    const g = lx.createLinearGradient(0, base, 0, base - 900);
    g.addColorStop(0, rgba(P.c[6], alpha)); g.addColorStop(.5, rgba(P.c[5], alpha)); g.addColorStop(1, rgba(P.c[1], alpha));
    lx.fillStyle = g;
    heights.forEach((h, i) => {
      const x = x0 + i * (bw + gap);
      for (let y = base - 14; y > base - h; y -= 24) lx.fillRect(x, y, bw, 14);
    });
    lx.fillStyle = rgba(P.c[15], alpha);
    heights.forEach((h, i) => lx.fillRect(x0 + i * (bw + gap), base - h - 44, bw, 8));
  };
  bloom(ctx, lx => drawBars(lx, 1), [70, 18], [.8, .7]);
  // Reflection
  const [rcv, rx] = layer(); drawBars(rx, 1);
  ctx.save(); ctx.translate(0, base * 2 + 20); ctx.scale(1, -1); ctx.globalAlpha = .18; ctx.filter = blur(6); ctx.drawImage(rcv, 0, 0, W, H); ctx.restore();
  const fade = ctx.createLinearGradient(0, base, 0, base + 700);
  fade.addColorStop(0, rgba(P.darker, 0)); fade.addColorStop(1, rgba(P.darker, 1));
  ctx.fillStyle = fade; ctx.fillRect(0, base + 10, W, H - base);
  vignette(ctx, P, .55);
  grain(ctx, P.index * 11, .045);
};

MOTIFS['waveform'] = (ctx, P, r, noise) => {
  skyGradient(ctx, [[0, P.darker], [.5, P.bg], [1, P.darker]]);
  const glowBg = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * .55);
  glowBg.addColorStop(0, rgba(P.c[5], .1)); glowBg.addColorStop(1, rgba(P.c[5], 0));
  ctx.fillStyle = glowBg; ctx.fillRect(0, 0, W, H);
  const ribbons = [[P.c[6], P.c[4]], [P.c[5], P.c[1]], [P.c[3], P.c[2]]];
  bloom(ctx, lx => {
    lx.globalCompositeOperation = 'lighter';
    ribbons.forEach(([a, b], ri) => {
      const f1 = .0012 + r() * .0008, f2 = .003 + r() * .002, ph = r() * 10, amp = 220 + r() * 160, yc = H * (.42 + ri * .08);
      for (let k = 0; k < 42; k++) {
        const t = k / 41, g = lx.createLinearGradient(0, 0, W, 0);
        g.addColorStop(0, rgba(a, 0)); g.addColorStop(.2, rgba(a, .5)); g.addColorStop(.8, rgba(b, .5)); g.addColorStop(1, rgba(b, 0));
        lx.strokeStyle = g; lx.lineWidth = 1.6;
        lx.beginPath();
        for (let x = 0; x <= W; x += 8) {
          const env = Math.sin(Math.PI * x / W);
          const y = yc + env * (amp * Math.sin(x * f1 + ph + t * 1.2) + amp * .35 * Math.sin(x * f2 + ph * 2 - t * 2)) + (t - .5) * 90 * env;
          x ? lx.lineTo(x, y) : lx.moveTo(x, y);
        }
        lx.stroke();
      }
    });
  }, [50, 14], [.9, .7]);
  vignette(ctx, P, .55);
  grain(ctx, P.index * 19, .045);
};

MOTIFS['blobs'] = (ctx, P, r) => {
  ctx.fillStyle = P.darker; ctx.fillRect(0, 0, W, H);
  // Luminous spots that use neighbour hues only, so the mix stays clean
  const sets = [[P.c[5], P.c[4], P.c[6]], [P.c[5], P.c[1], P.c[3]], [P.c[6], P.c[2], P.c[4]]];
  const cols = sets[P.index % sets.length];
  const spots = [[.22, .3], [.72, .38], [.48, .82], [.9, .9]];
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  spots.forEach(([u, v], i) => {
    const x = W * (u + (r() - .5) * .12), y = H * (v + (r() - .5) * .12), rad = 900 + r() * 700;
    const g = ctx.createRadialGradient(x, y, 0, x, y, rad);
    const col = cols[i % cols.length];
    g.addColorStop(0, rgba(col, .75)); g.addColorStop(.45, rgba(col, .3)); g.addColorStop(1, rgba(col, 0));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  });
  ctx.restore();
  // Bokeh
  const [bcv, bx] = layer();
  for (let i = 0; i < 46; i++) {
    const x = r() * W, y = r() * H, rad = 18 + Math.pow(r(), 2) * 110;
    bx.fillStyle = rgba(P.c[15], .05 + r() * .07); bx.strokeStyle = rgba(P.c[15], .14);
    bx.lineWidth = 3; bx.beginPath(); bx.arc(x, y, rad, 0, Math.PI * 2); bx.fill(); bx.stroke();
  }
  ctx.save(); ctx.filter = blur(3); ctx.drawImage(bcv, 0, 0, W, H); ctx.restore();
  vignette(ctx, P, .45);
  grain(ctx, P.index * 23, .07);
};

MOTIFS['depths'] = (ctx, P, r, noise) => {
  skyGradient(ctx, [[0, mix(P.bg, P.c[6], .28)], [.35, P.bg], [1, P.darker]]);
  // Light rays
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.filter = blur(16);
  for (let i = 0; i < 18; i++) {
    const x = W * (.05 + r() * .9), w = 30 + r() * 180, sk = 500 + r() * 400;
    const g = ctx.createLinearGradient(0, 0, 0, H * .9);
    g.addColorStop(0, rgba(P.c[14], .12 + r() * .14)); g.addColorStop(.7, rgba(P.c[6], .03)); g.addColorStop(1, rgba(P.c[6], 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x, -10); ctx.lineTo(x + w, -10); ctx.lineTo(x + w + sk + w, H * .9); ctx.lineTo(x + sk, H * .9); ctx.fill();
  }
  ctx.restore();
  // Seafloor
  const floor = ridge(r, noise, H * .9, 200, .0016, 21);
  fillRidge(ctx, floor, P.darker);
  // Plankton and bubbles
  bloom(ctx, lx => {
    for (let i = 0; i < 700; i++) {
      const y = H * Math.pow(r(), .7), x = r() * W, s = Math.pow(r(), 3) * 7 + 1;
      lx.fillStyle = rgba([P.c[6], P.c[2], P.c[5], P.c[14]][i % 4], .35 + r() * .65);
      lx.beginPath(); lx.arc(x, y, s, 0, Math.PI * 2); lx.fill();
    }
    lx.lineWidth = 2;
    for (let i = 0; i < 24; i++) {
      const x = r() * W, y = r() * H * .85, s = 6 + r() * 18;
      lx.strokeStyle = rgba(P.c[14], .5); lx.beginPath(); lx.arc(x, y, s, 0, Math.PI * 2); lx.stroke();
    }
  }, [36, 10], [.9, .7]);
  vignette(ctx, P, .55);
  grain(ctx, P.index * 29, .045);
};

MOTIFS['embers'] = (ctx, P, r, noise) => {
  skyGradient(ctx, [[0, P.darker], [.5, P.bg], [.85, mix(P.bg, P.c[1], .35)], [1, mix(P.bg, P.c[3], .45)]]);
  cloudField(ctx, P, noise, [P.c[1], P.c[9], P.c[3]], { alpha: .3, band: .4, tilt: 0 });
  const dune = ridge(r, noise, H * .86, 240, .0009, 8);
  fillRidge(ctx, dune, P.darker);
  bloom(ctx, lx => strokeRidge(lx, dune, P.c[3], 3), [40, 12], [.9, .7]);
  bloom(ctx, lx => {
    lx.lineCap = 'round';
    for (let i = 0; i < 1100; i++) {
      const x = r() * W, y = H * Math.pow(r(), .55), s = Math.pow(r(), 2.5) * 5 + 1.2;
      const col = [P.c[3], P.c[11], P.c[1], P.c[9], P.c[15]][Math.floor(r() * 5)];
      lx.strokeStyle = rgba(col, .4 + r() * .6); lx.lineWidth = s;
      const len = 6 + r() * 40, drift = (noise(x * .002, y * .002) * 60);
      lx.beginPath(); lx.moveTo(x, y); lx.quadraticCurveTo(x + drift * .5, y - len * .5, x + drift, y - len); lx.stroke();
    }
  }, [40, 10], [.9, .8]);
  vignette(ctx, P, .55);
  grain(ctx, P.index * 37, .05);
};

MOTIFS['pixels'] = (ctx, P, r, noise) => {
  const cell = 40, cols = W / cell, rows = Math.ceil(H / cell);
  const sky = [P.darker, P.bg, P.c[0], mix(P.c[0], P.c[5], .35), mix(P.c[0], P.c[1], .5)];
  const bayer = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
  const hz = Math.floor(rows * .68);
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const t = clamp(y / hz, 0, 1) * (sky.length - 1), i = Math.floor(t), f = t - i;
    const pick = f > (bayer[y % 4][x % 4] + .5) / 16 ? Math.min(i + 1, sky.length - 1) : i;
    ctx.fillStyle = sky[pick]; ctx.fillRect(x * cell, y * cell, cell, cell);
  }
  // Stars
  for (let i = 0; i < 90; i++) { ctx.fillStyle = r() < .5 ? P.c[15] : P.c[14]; ctx.fillRect(Math.floor(r() * cols) * cell + 14, Math.floor(r() * hz * .6) * cell + 14, 12, 12); }
  // Pixel moon
  const mx = Math.floor(cols * .72), my = Math.floor(rows * .2), mr = 5;
  for (let y = -mr; y <= mr; y++) for (let x = -mr; x <= mr; x++) if (x * x + y * y <= mr * mr + 2) { ctx.fillStyle = x + y > 3 ? P.c[3] : P.c[11]; ctx.fillRect((mx + x) * cell, (my + y) * cell, cell, cell); }
  // Stepped mountains
  const layersM = [[P.c[4], .3, 7], [mix(P.c[4], P.darker, .5), .18, 13], [P.darker, .1, 29]];
  layersM.forEach(([col, amp, seed]) => {
    for (let x = 0; x < cols; x++) {
      const h = Math.floor(hz - Math.abs(noise.fbm(x * .035 + seed, seed, 3)) * rows * amp * 2.2 - rows * .04);
      ctx.fillStyle = col; ctx.fillRect(x * cell, h * cell, cell, H);
      ctx.fillStyle = rgba(P.c[15], col === P.darker ? 0 : .25); ctx.fillRect(x * cell, h * cell, cell, cell / 4);
    }
  });
  // Ground grid
  for (let y = hz; y < rows; y++) for (let x = 0; x < cols; x++) {
    ctx.fillStyle = (x + y) % 2 ? P.darker : mix(P.darker, P.c[5], .12); ctx.fillRect(x * cell, y * cell, cell, cell);
  }
  bloom(ctx, lx => { lx.fillStyle = P.c[6]; lx.fillRect(0, hz * cell - 4, W, 8); }, [40, 10], [.9, .8]);
  // Pixel gridlines
  ctx.fillStyle = rgba(P.darker, .18);
  for (let x = 0; x < W; x += cell) ctx.fillRect(x, 0, 2, H);
  for (let y = 0; y < H; y += cell) ctx.fillRect(0, y, W, 2);
  vignette(ctx, P, .45);
};

MOTIFS['scanlines'] = (ctx, P, r, noise) => {
  skyGradient(ctx, [[0, P.darker], [.5, P.bg], [1, P.darker]]);
  cloudField(ctx, P, noise, [P.c[4], P.c[5], P.c[6]], { alpha: .35, band: .5, tilt: -.2 });
  // Glitch bars with channel offset
  for (let i = 0; i < 16; i++) {
    const y = r() * H, h = 8 + r() * 90, x = r() * W * .6, w = W * (.2 + r() * .6), off = 16 + r() * 36;
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = rgba(P.c[1], .22); ctx.fillRect(x - off, y, w, h);
    ctx.fillStyle = rgba(P.c[6], .22); ctx.fillRect(x + off, y, w, h);
    ctx.fillStyle = rgba(P.c[15], .08); ctx.fillRect(x, y, w, h);
    ctx.globalCompositeOperation = 'source-over';
  }
  // Tracking band
  const ty = H * (.25 + r() * .5);
  ctx.save(); ctx.filter = blur(20); ctx.fillStyle = rgba(P.c[15], .1); ctx.fillRect(0, ty, W, 120); ctx.restore();
  for (let i = 0; i < 4000; i++) { ctx.fillStyle = rgba(P.c[15], r() * .5); ctx.fillRect(r() * W, ty + r() * 120, 2 + r() * 14, 2); }
  // OSD
  bloom(ctx, lx => {
    lx.font = `bold 84px ${MONO}`; lx.fillStyle = P.c[15]; lx.textBaseline = 'top';
    lx.fillText('PLAY ▶', 200, 170);
    lx.fillText(`SP  0${P.index % 10}:${String(P.index * 7 % 60).padStart(2, '0')}:${String(P.index * 13 % 60).padStart(2, '0')}`, 200, H - 280);
    lx.textAlign = 'right'; lx.fillText(P.name.toUpperCase(), W - 200, 170);
  }, [24, 8], [.8, .6]);
  ctx.fillStyle = rgba('#000000', .28);
  for (let y = 0; y < H; y += 8) ctx.fillRect(0, y, W, 3);
  // CRT corners
  const g = ctx.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, W * .58);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.8)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  grain(ctx, P.index * 41, .09);
};

MOTIFS['contours'] = (ctx, P, r, noise) => {
  ctx.fillStyle = P.bg; ctx.fillRect(0, 0, W, H);
  const step = 10, gw = Math.ceil(W / step) + 1, gh = Math.ceil(H / step) + 1, f = new Float32Array(gw * gh);
  for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) f[y * gw + x] = noise.fbm(x * step / 1400 + 3, y * step / 1400 + 7, 5);
  const levels = 22, lo = -.55, hi = .55;
  const cols = [P.c[4], P.c[6], P.c[2], P.c[3], P.c[1]];
  const drawLevels = (lx, onlyAccent) => {
    for (let li = 0; li < levels; li++) {
      const iso = lo + (hi - lo) * li / (levels - 1);
      const accent = li % 5 === 0;
      if (onlyAccent && !accent) continue;
      const t = li / (levels - 1) * (cols.length - 1), i0 = Math.floor(t);
      lx.strokeStyle = rgba(mix(cols[i0], cols[Math.min(i0 + 1, cols.length - 1)], t - i0), accent ? .95 : .45);
      lx.lineWidth = accent ? 3.5 : 2;
      lx.beginPath();
      for (let y = 0; y < gh - 1; y++) for (let x = 0; x < gw - 1; x++) {
        const a = f[y * gw + x], b = f[y * gw + x + 1], c = f[(y + 1) * gw + x + 1], d = f[(y + 1) * gw + x];
        const idx = (a > iso) | (b > iso) << 1 | (c > iso) << 2 | (d > iso) << 3;
        if (idx === 0 || idx === 15) continue;
        const px = x * step, py = y * step;
        const e = [
          [px + step * (iso - a) / (b - a), py], [px + step, py + step * (iso - b) / (c - b)],
          [px + step * (iso - d) / (c - d), py + step], [px, py + step * (iso - a) / (d - a)],
        ];
        const seg = { 1: [[3, 0]], 2: [[0, 1]], 3: [[3, 1]], 4: [[1, 2]], 5: [[3, 0], [1, 2]], 6: [[0, 2]], 7: [[3, 2]], 8: [[2, 3]], 9: [[0, 2]], 10: [[0, 1], [2, 3]], 11: [[1, 2]], 12: [[1, 3]], 13: [[0, 1]], 14: [[0, 3]] }[idx];
        seg.forEach(([s, t2]) => { lx.moveTo(e[s][0], e[s][1]); lx.lineTo(e[t2][0], e[t2][1]); });
      }
      lx.stroke();
    }
  };
  drawLevels(ctx, false);
  bloom(ctx, lx => drawLevels(lx, true), [30, 8], [.7, .5]);
  // Survey markers
  bloom(ctx, lx => {
    for (let i = 0; i < 9; i++) {
      const x = W * (.1 + r() * .8), y = H * (.1 + r() * .8);
      lx.fillStyle = P.accent; lx.beginPath(); lx.arc(x, y, 9, 0, Math.PI * 2); lx.fill();
      lx.strokeStyle = rgba(P.accent, .8); lx.lineWidth = 2; lx.beginPath(); lx.arc(x, y, 30, 0, Math.PI * 2); lx.stroke();
    }
  }, [30, 8], [.9, .7]);
  vignette(ctx, P, .6);
  grain(ctx, P.index * 43, .04);
};

MOTIFS['tubes'] = (ctx, P, r) => {
  skyGradient(ctx, [[0, P.darker], [.6, P.bg], [.7, P.darker], [1, P.darker]]);
  // Brick wall
  ctx.fillStyle = rgba(P.c[0], .55);
  for (let y = 0, row = 0; y < H * .7; y += 64, row++) for (let x = (row % 2) * -80; x < W; x += 160) ctx.fillRect(x + 4, y + 4, 152, 56);
  const floorY = H * .7, cx = W / 2, cy = H * .38;
  const shapes = [
    lx => { lx.strokeStyle = P.c[6]; lx.lineWidth = 20; lx.beginPath(); lx.arc(cx - 260, cy, 360, 0, Math.PI * 2); lx.stroke(); },
    lx => { lx.strokeStyle = P.c[5]; lx.lineWidth = 20; lx.beginPath(); lx.moveTo(cx + 260, cy - 420); lx.lineTo(cx + 660, cy + 300); lx.lineTo(cx - 140, cy + 300); lx.closePath(); lx.stroke(); },
    lx => { lx.strokeStyle = P.c[3]; lx.lineWidth = 12; lx.beginPath(); for (let i = 0; i < 9; i++) { const x = cx - 1100 + i * 110; lx.lineTo(x, cy + 380 + (i % 2 ? -60 : 60)); } lx.stroke(); },
    lx => { lx.strokeStyle = P.c[1]; lx.lineWidth = 12; lx.beginPath(); lx.roundRect(cx + 800, cy - 420, 260, 260, 40); lx.stroke(); },
    lx => { lx.fillStyle = P.c[2]; for (let i = 0; i < 5; i++) { lx.beginPath(); lx.arc(cx - 1250 + i * 70, cy - 380, 16, 0, Math.PI * 2); lx.fill(); } },
  ];
  const draw = lx => { lx.lineCap = 'round'; lx.lineJoin = 'round'; shapes.forEach(s => s(lx)); };
  bloom(ctx, draw, [110, 30], [.9, .9]);
  // White hot core
  bloom(ctx, lx => { draw(lx); lx.globalCompositeOperation = 'source-in'; lx.fillStyle = rgba(P.c[15], .55); lx.fillRect(0, 0, W, H); }, [4], [.3]);
  // Floor reflection
  const [rcv, rx] = layer(); draw(rx);
  ctx.fillStyle = P.darker; ctx.fillRect(0, floorY, W, H - floorY);
  ctx.save(); ctx.beginPath(); ctx.rect(0, floorY, W, H - floorY); ctx.clip();
  ctx.translate(0, floorY * 2); ctx.scale(1, -1); ctx.globalAlpha = .3; ctx.filter = blur(24); ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(rcv, 0, 0, W, H);
  ctx.restore();
  const fade = ctx.createLinearGradient(0, floorY, 0, H);
  fade.addColorStop(0, rgba(P.darker, 0)); fade.addColorStop(1, rgba(P.darker, 1));
  ctx.fillStyle = fade; ctx.fillRect(0, floorY, W, H - floorY);
  vignette(ctx, P, .55);
  grain(ctx, P.index * 47, .05);
};

MOTIFS['planet'] = (ctx, P, r, noise) => {
  ctx.fillStyle = P.darker; ctx.fillRect(0, 0, W, H);
  stars(ctx, r, 2200, H, [P.fg, P.c[14], P.c[11]], 2.4);
  cloudField(ctx, P, noise, [P.c[4], P.c[5]], { alpha: .35, band: .45, tilt: .4 });
  const cx = W * .5, cy = H * .5;
  if (P.slug === 'black-hole') {
    const disk = lx => {
      for (let i = 0; i < 60; i++) {
        const t = i / 59, rr = 520 + t * 520;
        lx.strokeStyle = rgba([P.c[11], P.c[3], P.c[1], P.c[5]][Math.floor(t * 3.99)], (1 - t) * .5 + .1);
        lx.lineWidth = 5; lx.beginPath(); lx.ellipse(cx, cy, rr * 1.4, rr * .22, -.12, 0, Math.PI * 2); lx.stroke();
      }
      lx.strokeStyle = P.c[11]; lx.lineWidth = 16; lx.beginPath(); lx.ellipse(cx, cy - 20, 470, 470, 0, Math.PI * 1.05, Math.PI * 1.95); lx.stroke();
    };
    bloom(ctx, disk, [120, 30], [.9, .9]);
    ctx.fillStyle = '#000000'; ctx.beginPath(); ctx.arc(cx, cy, 440, 0, Math.PI * 2); ctx.fill();
    // Front part of the disk crosses the shadow
    bloom(ctx, lx => { lx.save(); lx.beginPath(); lx.rect(0, cy, W, H); lx.clip(); disk(lx); lx.restore(); }, [60], [.6]);
  } else {
    const pr = 820, px = W * .62, py = H * .62;
    bloom(ctx, lx => { lx.fillStyle = P.accent; lx.beginPath(); lx.arc(px, py, pr + 6, 0, Math.PI * 2); lx.fill(); }, [120, 40], [.8, .6]);
    const [pcv, pc] = layer();
    pc.save(); pc.beginPath(); pc.arc(px, py, pr, 0, Math.PI * 2); pc.clip();
    for (let y = py - pr; y < py + pr; y += 4) {
      const v = noise.fbm(3, y * .004, 4) + noise(y * .02, 5) * .3;
      pc.fillStyle = mix(mix(P.c[1], P.c[3], clamp(v + .5, 0, 1)), P.darker, clamp(-v, 0, .6));
      pc.fillRect(px - pr, y, pr * 2, 4);
    }
    pc.filter = blur(6); pc.drawImage(pcv, 0, 0, W, H); pc.filter = 'none';
    const shade = pc.createRadialGradient(px - pr * .45, py - pr * .45, pr * .1, px, py, pr * 1.05);
    shade.addColorStop(0, 'rgba(0,0,0,0)'); shade.addColorStop(.7, 'rgba(0,0,0,.45)'); shade.addColorStop(1, 'rgba(0,0,0,.92)');
    pc.fillStyle = shade; pc.fillRect(0, 0, W, H);
    pc.restore();
    ctx.drawImage(pcv, 0, 0, W, H);
    bloom(ctx, lx => { lx.strokeStyle = rgba(P.c[14], .9); lx.lineWidth = 6; lx.beginPath(); lx.arc(px, py, pr, Math.PI * .95, Math.PI * 1.65); lx.stroke(); }, [40, 12], [.9, .7]);
  }
  vignette(ctx, P, .5);
  grain(ctx, P.index * 53, .045);
};

// ---------- entry point ----------

window.renderImage = async (theme, kind, width, height, mime = 'image/png', quality = .92) => {
  await document.fonts.load(`40px ${MONO}`);
  const cv = document.getElementById('c');
  cv.width = width; cv.height = height;
  const ctx = cv.getContext('2d');
  S = width / W;
  ctx.setTransform(S, 0, 0, S, 0, 0);
  const P = { ...theme, bg: theme.colors.background, fg: theme.colors.foreground, darker: theme.colors.darker_background, accent: theme.colors.accent, c: theme.ansi };
  const r = rng(theme.index * 104729 + (kind === 'wordmark' ? 1 : 2));
  const noise = makeNoise(theme.index * 7907 + 3);
  if (kind === 'wordmark') wordmark(ctx, P, r);
  else MOTIFS[theme.motif](ctx, P, r, noise);
  return cv.toDataURL(mime, quality);
};
